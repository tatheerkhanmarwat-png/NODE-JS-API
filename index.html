<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Inventory CRUD</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; background: #f7f7f7; }
    h1 { margin-bottom: 16px; }
    form { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    input, button { padding: 8px; font-size: 14px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #222; color: #fff; }
    .actions { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <h1>Smart Warehouse — Products CRUD</h1>

  <form id="productForm">
    <input type="hidden" id="editId" />
    <input type="text" id="name" placeholder="Product Name" required />
    <input type="number" id="price" placeholder="Price" required />
    <input type="number" id="stock_quantity" placeholder="Stock Qty" required />
    <input type="number" id="category_id" placeholder="Category ID (1-3)" required />
    <input type="number" id="supplier_id" placeholder="Supplier ID (1-2)" required />
    <button type="submit" id="submitBtn" style="grid-column: span 5;">Add Product</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category ID</th>
        <th>Supplier ID</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="productTable"></tbody>
  </table>

  <script>
    const API = '/api/products';
    const form = document.getElementById('productForm');
    const tbody = document.getElementById('productTable');

    function getRowId(item) {
      return item.product_id ?? item.id;
    }

    async function loadProducts() {
      const res = await fetch(API);
      const data = await res.json();
      tbody.innerHTML = '';

      data.forEach(item => {
        const id = getRowId(item);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${id}</td>
          <td>${item.name}</td>
          <td>${item.price}</td>
          <td>${item.stock_quantity}</td>
          <td>${item.category_id}</td>
          <td>${item.supplier_id}</td>
          <td class="actions">
            <button onclick='startEdit(${JSON.stringify(item)})'>Edit</button>
            <button onclick='deleteProduct(${id})'>Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.startEdit = function(item) {
      document.getElementById('editId').value = getRowId(item);
      document.getElementById('name').value = item.name;
      document.getElementById('price').value = item.price;
      document.getElementById('stock_quantity').value = item.stock_quantity;
      document.getElementById('category_id').value = item.category_id;
      document.getElementById('supplier_id').value = item.supplier_id;
      document.getElementById('submitBtn').textContent = 'Update Product';
    };

    window.deleteProduct = async function(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      loadProducts();
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const payload = {
        name: document.getElementById('name').value,
        price: document.getElementById('price').value,
        stock_quantity: document.getElementById('stock_quantity').value,
        category_id: document.getElementById('category_id').value,
        supplier_id: document.getElementById('supplier_id').value
      };

      if (editId) {
        await fetch(`${API}/${editId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('editId').value = '';
        document.getElementById('submitBtn').textContent = 'Add Product';
      } else {
        await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      form.reset();
      loadProducts();
    });

    loadProducts();
  </script>
</body>
</html>
